[project]
name = "barons-journal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IsaiahSama" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
barons-journal = "barons_journal:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
